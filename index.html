
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grace Witulski Data Visualization</title>

  <script src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@6"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>

<body>
  <h1>Grace Witulski Data Visualization</h1>
  <p>Chart 1</p>

  <div id="chart"></div>
  <div id="penguin-chart"></div>

  <script>
    const chart = {
      data: {
        values: [
          {category: "A", value: 10},
          {category: "B", value: 25},
          {category: "C", value: 18},
          {category: "D", value: 35}
        ]
      },
      mark: "bar",
      encoding: {
        x: {field: "category", type: "nominal", title: "Category"},
        y: {field: "value", type: "quantitative", title: "Value"}
      }
    };

    vegaEmbed("#chart", chart);

const penguins = {
  "$schema": "https://vega.github.io/schema/vega-lite/v6.json",
  "title": "Distribution of Body Mass of Penguins",
  "width": 400,
  "height": 80,
  "data": {
    "url": "https://raw.githubusercontent.com/vega/vega-datasets/main/data/penguins.json"
  },
  "mark": "area",
  "transform": [
    {
      "density": "Body Mass (g)",
      "groupby": ["Species"],
      "extent": [2500, 6500]
    }
  ],
  "encoding": {
    "x": {
      "field": "value",
      "type": "quantitative",
      "title": "Body Mass (g)"
    },
    "y": {
      "field": "density",
      "type": "quantitative",
      "stack": "zero"
    },
    "color": {
      "field": "Species",
      "type": "nominal"
    }
  }
};

vegaEmbed("#penguin-chart", penguins);

  </script>
</body>
</html>
